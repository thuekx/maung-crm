name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: maung_crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/maung_crm_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Uji skrip server (update.sh, setup-deploy-key.sh) dengan docker/ssh tiruan
        run: bash tests/server-scripts/run.sh
      - name: Validasi compose (IMAGE_TAG wajib; valid bila diisi)
        env:
          POSTGRES_PASSWORD: ci
          WO_URL: https://wo.example.test
          FILE_SIGN_SECRET: ci
        run: |
          if docker compose config -q 2>/dev/null; then echo "IMAGE_TAG seharusnya wajib"; exit 1; fi
          IMAGE_TAG=ci-validate docker compose config -q

  images:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # Tag yang dipakai server = SHA commit penuh. `latest` hanya alias informatif (compose tidak memakainya).
          tags: |
            ghcr.io/thuekx/maung-crm-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/thuekx/maung-crm-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
