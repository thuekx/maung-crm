# Overlay untuk VM yang SAMA dengan Maung WO: web CRM ikut jaringan WO (alias `crm-web`)
# supaya Caddy milik WO dapat meneruskan domain CRM. Hanya `web` yang bergabung (api/postgres/garage tetap privat),
# agar nama `api`/`web` tidak bentrok dengan service WO.
#   docker compose -f docker-compose.yml -f docker-compose.wo-vm.yml up -d
services:
  web:
    ports: !override []
    networks:
      default: {}
      wo:
        aliases: [crm-web]
networks:
  wo:
    external: true
    name: ${WO_NETWORK:-maung-wo-inv_default}
