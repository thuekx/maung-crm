name: maung-crm

# CRM di jalur /crm pada domain Maung WO (satu domain, satu login). Caddy milik WO; CRM TIDAK membuka port host
# dan tidak menjalankan proxy. Hanya crm-web & crm-api bergabung ke jaringan eksternal `maung_edge` (dibuat oleh
# deploy WO) dengan nama service unik; postgres hanya di jaringan privat CRM.
# Penyimpanan foto = Garage BERSAMA milik stack tersendiri `maung-garage` (repo WO: platform/garage; skrip
# scripts/garage-platform.sh). Hanya crm-api bergabung ke jaringan eksternal `maung_storage` untuk menjangkaunya
# (http://maung-garage:3900, path-style). CRM TIDAK lagi menjalankan Garage sendiri. Bucket `crm-photos` & kunci
# `crm-key` (S3_*) tetap. JANGAN `docker compose down -v` di sini sebelum volume Garage lama diadopsi/difinalisasi.
# Konfigurasi lewat .env (lihat .env.example). IMAGE_TAG WAJIB (SHA commit; tidak ada `latest` bawaan).
#
# Bila container tidak bisa menjangkau WO_URL (hairpin), tambahkan pada crm-api:
#   extra_hosts: ["maung.liv.net.id:host-gateway"]
# — jangan menempel CRM ke jaringan WO.

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}
      POSTGRES_DB: maung_crm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d maung_crm"]
      interval: 5s
      retries: 10

  crm-api:
    image: ghcr.io/thuekx/maung-crm-api:${IMAGE_TAG:?isi IMAGE_TAG (SHA commit image)}
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      PORT: "4000"
      API_BASE: /crm/api
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}@postgres:5432/maung_crm
      WO_URL: ${WO_URL:?isi WO_URL (alamat publik Maung WO, mis. https://maung.liv.net.id)}
      FILE_SIGN_SECRET: ${FILE_SIGN_SECRET:?isi FILE_SIGN_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://maung-garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-crm-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [default, edge, storage]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/crm/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  crm-web:
    image: ghcr.io/thuekx/maung-crm-web:${IMAGE_TAG:?isi IMAGE_TAG (SHA commit image)}
    restart: unless-stopped
    depends_on:
      crm-api: { condition: service_healthy }
    networks: [default, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/crm').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    # Tanpa `ports:` — Caddy WO menjangkau lewat maung_edge (crm-web:3000, crm-api:4000).

networks:
  edge:
    name: maung_edge
    external: true
  storage:
    name: maung_storage
    external: true # dibuat oleh scripts/garage-platform.sh (repo WO); bukan maung_edge

volumes:
  pgdata:
