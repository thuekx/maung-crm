# Overlay VM TERPISAH dari WO: Caddy sendiri (HTTPS otomatis) untuk CRM_DOMAIN.
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  web:
    ports: !override []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?isi CRM_DOMAIN}
    command: ["sh", "-c", "printf '%s {\\n\\treverse_proxy web:3000\\n}\\n' \"$$CRM_DOMAIN\" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [web]
volumes:
  caddy_data:
  caddy_config:
